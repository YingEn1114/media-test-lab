name: zgnews-smoke

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "被测站点"
        required: false
        default: "https://www.zhengguannews.cn"
  schedule:
    # UTC 01:00 = Asia/Shanghai 09:00
    - cron: "0 1 * * *"

concurrency:
  group: zgnews-smoke
  cancel-in-progress: false

defaults:
  run:
    working-directory: zgnews-tests

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ZG_BASE_URL: ${{ inputs.base_url || vars.ZG_BASE_URL || 'https://www.zhengguannews.cn' }}
      ZG_CHANNEL: chromium
      ZG_HEADLESS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: zgnews-tests/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Install Chromium
        run: playwright install --with-deps chromium
      - name: Prepare report dirs
        run: mkdir -p reports screenshots
      - name: Run smoke (8 cases)
        run: pytest -m smoke -q --html=reports/smoke.html --self-contained-html
      - name: Upload smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-report
          path: |
            zgnews-tests/reports/smoke.html
            zgnews-tests/screenshots/
