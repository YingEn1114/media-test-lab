name: platform-unit

on:
  push:
  pull_request:
  workflow_dispatch:

defaults:
  run:
    working-directory: zgnews-tests

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: zgnews-tests/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run platform unit tests
        run: pytest platform-tests -q
